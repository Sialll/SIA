name: PR Rules Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

jobs:
  pr_rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require exception reason for multi-file PRs
        if: ${{ contains(github.event.pull_request.labels.*.name, 'exception:multi-file') }}
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          BODY="${PR_BODY:-}"
          if printf '%s' "$BODY" | grep -qiE '(Exception reason:|예외 사유:)'; then
            echo "✅ Exception reason found."
          else
            echo "❌ Missing exception reason."
            echo "Please add ONE of the following lines to the PR description:"
            echo "- Exception reason: <text>"
            echo "- 예외 사유: <text>"
            exit 1
          fi

      - name: Compute changed files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1 || true
          FILES=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD | tr '\n' ',' | sed 's/,$//')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed files: $FILES"

      - name: Run SIA PR checks
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'exception:multi-file') }}
        shell: bash
        run: |
          set -euo pipefail
          python -c "from src.sia.cli import main; import sys; sys.exit(main(['check-pr','--files','${{ steps.changed.outputs.files }}']))"
